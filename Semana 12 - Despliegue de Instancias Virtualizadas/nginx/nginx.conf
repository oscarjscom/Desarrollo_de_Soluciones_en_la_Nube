# Balanceador de carga: reparte las peticiones entre nodo1 y nodo2 (round robin)
upstream nodos {
    # Zona de memoria compartida: todos los procesos de Nginx comparten el turno del reparto
    zone nodos 64k;
    server nodo1:3000 max_fails=2 fail_timeout=3s;
    server nodo2:3000 max_fails=2 fail_timeout=3s;
}

server {
    listen 80;

    location / {
        proxy_pass http://nodos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Si un nodo no responde, la petición se reintenta en el otro
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        add_header X-Balanceador "nginx" always;
    }
}
